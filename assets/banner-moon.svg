<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Moon Junseok"><defs><linearGradient id="ink" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#d3d8e2"/><stop offset="1" stop-color="#a3abbb"/></linearGradient><radialGradient id="bl" cx=".4" cy=".4" r=".8"><stop offset="0" stop-color="#9cc9ff"/><stop offset=".6" stop-color="#3f7dff"/><stop offset="1" stop-color="#1f4fd8"/></radialGradient><clipPath id="c"><rect width="1200" height="260" rx="28"/></clipPath><filter id="ab" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter><mask id="mk2" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="260"><rect width="1200" height="260" fill="#000"/><circle cx="600" cy="130" r="110" fill="#fff"/><circle class="p2" cx="600" cy="130" r="110" fill="#000"/></mask>
<filter id="fg2" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="18"/></filter></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,"Noto Sans KR",sans-serif}.t{font-size:84px;font-weight:700;letter-spacing:-3px}
.f{opacity:0;animation:u 1.8s cubic-bezier(.16,1,.3,1) .2s forwards}@keyframes u{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.am{opacity:.35}.q1{animation:a1 30s ease-in-out infinite alternate}.q2{animation:a2 36s ease-in-out infinite alternate}
@keyframes a1{to{transform:translate(480px,30px)}}@keyframes a2{to{transform:translate(-500px,-30px)}}.p2{animation:p2 36s ease-in-out infinite;animation-delay:-0s}
@keyframes p2{0%{transform:translateX(0)}48%{transform:translateX(220px)}48.01%{transform:translateX(-220px)}96%,100%{transform:translateX(0)}}.dr2{animation:d2 36s ease-in-out infinite alternate}@keyframes d2{from{transform:translateX(-380px)}to{transform:translateX(380px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.f{opacity:1}}</style>
<g clip-path="url(#c)"><rect width="1200" height="260" fill="#02040a"/><g filter="url(#ab)"><circle class="am q1" cx="180" cy="90" r="100" fill="#1f4fd8"/><circle class="am q2" cx="980" cy="180" r="110" fill="#0f7fa8"/></g><g class="dr2"><g filter="url(#fg2)" opacity="0.7"><circle cx="600" cy="130" r="110" fill="url(#bl)" mask="url(#mk2)"/></g></g>
<text class="t f" x="600" y="150" text-anchor="middle" fill="url(#ink)">Moon Junseok</text></g></svg>