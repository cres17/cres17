<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Moon Junseok">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <linearGradient id="ink" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#d4d6da"/>
      <stop offset=".55" stop-color="#8e9096"/><stop offset=".78" stop-color="#e4e6ea"/><stop offset="1" stop-color="#a7a9af"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="260" rx="28"/></clipPath>
  </defs>
  <style>
    .orb{opacity:.62}
    .o1{fill:#5ac8fa}.o2{fill:#af52de}.o3{fill:#ff9f0a}.o4{fill:#30d158}.o5{fill:#ff375f}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,"Noto Sans KR",sans-serif}
    .t{font-size:84px;font-weight:700;letter-spacing:-3px}
    .fade{opacity:0;animation:up 1.4s cubic-bezier(.16,1,.3,1) .2s forwards}
    @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    .a1{animation:m1 17s ease-in-out infinite}
    .a2{animation:m2 19s ease-in-out infinite}
    .a3{animation:m3 14s ease-in-out infinite}
    .a4{animation:m4 22s ease-in-out infinite}
    .a5{animation:m5 18s ease-in-out infinite}
    @keyframes m1{0%,100%{transform:translate(0,0)}25%{transform:translate(420px,40px)}50%{transform:translate(640px,-30px)}75%{transform:translate(300px,60px)}}
    @keyframes m2{0%,100%{transform:translate(0,0)}25%{transform:translate(-340px,-50px)}50%{transform:translate(-560px,40px)}75%{transform:translate(-220px,-40px)}}
    @keyframes m3{0%,100%{transform:translate(0,0)}33%{transform:translate(-480px,50px)}66%{transform:translate(-820px,-20px)}}
    @keyframes m4{0%,100%{transform:translate(0,0)}33%{transform:translate(380px,-70px)}66%{transform:translate(700px,10px)}}
    @keyframes m5{0%,100%{transform:translate(0,0)}25%{transform:translate(-260px,-60px)}50%{transform:translate(260px,50px)}75%{transform:translate(520px,-40px)}}
    @media (prefers-reduced-motion: reduce){.a1,.a2,.a3,.a4,.a5,.fade{animation:none;opacity:1}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="260" fill="#000"/>
    <g filter="url(#blur)">
      <circle class="orb o1 a1" cx="180" cy="110" r="105"/>
      <circle class="orb o2 a2" cx="700" cy="170" r="115"/>
      <circle class="orb o3 a3" cx="1050" cy="80" r="95"/>
      <circle class="orb o4 a4" cx="120" cy="200" r="90"/>
      <circle class="orb o5 a5" cx="500" cy="60" r="85"/>
    </g>
    <text class="t fade" x="600" y="150" text-anchor="middle" fill="url(#ink)">Moon Junseok</text>
  </g>
</svg>
