<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Moon Junseok">
<defs>
<linearGradient id="ink" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#d3d8e2"/><stop offset="1" stop-color="#a3abbb"/></linearGradient>
<radialGradient id="bl" cx=".4" cy=".4" r=".8"><stop offset="0" stop-color="#9cc9ff"/><stop offset=".6" stop-color="#3f7dff"/><stop offset="1" stop-color="#1f4fd8"/></radialGradient>
<clipPath id="c"><rect width="1200" height="260" rx="28"/></clipPath>
<filter id="ab" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
<filter id="fg" x="-60%" y="-100%" width="220%" height="300%"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="fs" x="-30%" y="-50%" width="160%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
<mask id="mk" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="260"><rect width="1200" height="260" fill="#000"/><circle cx="600" cy="130" r="110" fill="#fff"/><circle class="sh" cx="600" cy="130" r="110" fill="#000"/></mask>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,"Noto Sans KR",sans-serif}.t{font-size:84px;font-weight:700;letter-spacing:-3px}
.f{opacity:0;animation:u 1.8s cubic-bezier(.16,1,.3,1) .2s forwards}@keyframes u{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.am{opacity:.35;animation:br 9s ease-in-out infinite alternate}@keyframes br{from{opacity:.28}to{opacity:.42}}
/* 한 방향 이동(왼쪽→오른쪽)과 위상 변화(신월→보름)를 같은 길이로 두고 alternate로 되감아, 돌아올 때는 정확히 역재생 */
.dr{animation:dr 40s ease-in-out infinite alternate}
.sh{animation:sh 40s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateX(-380px)}to{transform:translateX(380px)}}
@keyframes sh{from{transform:translateX(0)}to{transform:translateX(220px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.f{opacity:1}}
</style>
<g clip-path="url(#c)"><rect width="1200" height="260" fill="#02040a"/>
<g filter="url(#ab)"><circle class="am" cx="180" cy="90" r="100" fill="#1f4fd8"/><circle class="am" cx="980" cy="180" r="110" fill="#0f7fa8"/></g>
<g class="dr"><g filter="url(#fg)" opacity=".5"><circle cx="600" cy="130" r="110" fill="url(#bl)" mask="url(#mk)"/></g>
<g filter="url(#fs)" opacity=".42"><circle cx="600" cy="130" r="110" fill="url(#bl)" mask="url(#mk)"/></g></g>
<text class="t f" x="600" y="150" text-anchor="middle" fill="url(#ink)">Moon Junseok</text></g></svg>